<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu perfil | Salão Sandra Nerys</title>
<meta name="description" content="Gerencie seu perfil no Salão Sandra Nerys: foto, nome, contato e descrição do seu estilo de beleza.">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --brand: #b3432b;
  --brand-dark: #7a2c1c;
  --brand-light: #f7ece8;
}
html, body { height: 100%; margin: 0; }
body {
  font-family: 'Inter', sans-serif;
  color: #2b2320;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}
.brand-font { font-family: 'Playfair Display', serif; }

.header-brand {
  flex-shrink: 0;
  background: rgba(247, 236, 232, 0.9);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(0, 0, 0, 0.06);
}
.navbar-brand, .text-brand { color: var(--brand) !important; }
.nav-link.active { color: var(--brand) !important; font-weight: 500; }

.page-main {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  padding: clamp(.5rem, 2vh, 1.5rem) 1rem;
}

.btn-brand {
  background: radial-gradient(120% 150% at 30% 30%, #e0392a, #8a1f14);
  border: none;
  color: #fff;
}
.btn-brand:hover { color: #fff; opacity: .9; }

.btn-outline-brand {
  border: 1px solid var(--brand);
  color: var(--brand);
}
.btn-outline-brand:hover { background: var(--brand-light); color: var(--brand); }

.cover-brand {
  height: clamp(70px, 14vh, 130px);
  background: linear-gradient(100deg, var(--brand-dark), var(--brand));
}

.avatar {
  width: clamp(80px, 15vh, 128px);
  height: clamp(80px, 15vh, 128px);
  border: 4px solid #fff;
  background: var(--brand-light);
  color: var(--brand);
  font-size: clamp(1.2rem, 3vh, 1.8rem);
  font-weight: 600;
  margin-top: clamp(-40px, -7.5vh, -64px);
}

.info-box {
  background: var(--brand-light);
  border-radius: 1rem;
}

.label-eyebrow {
  font-size: .72rem;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: #8a7f79;
}

.icon-svg { width: 16px; height: 16px; vertical-align: -3px; }

.card-profile {
  border: 1px solid rgba(0, 0, 0, .08);
  box-shadow: 0 4px 16px rgba(0, 0, 0, .06);
}
</style>
</head>
<body>

<!-- Header -->
<header class="navbar navbar-expand-lg py-2 header-brand">
  <div class="container">
    <a class="navbar-brand brand-font fs-4" href="index.html">Sandra Nerys</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-4">
        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
        <li class="nav-item"><a class="nav-link" href="#servicos">Serviços</a></li>
        <li class="nav-item"><a class="nav-link" href="#produtos">Produtos</a></li>
        <li class="nav-item mt-2 mt-lg-0">
          <a class="btn btn-brand rounded-pill px-4" href="#ia">
            <svg class="icon-svg me-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg>IA
          </a>
        </li>
        <li class="nav-item"><a class="nav-link active" href="#">Perfil</a></li>
        <li class="nav-item"><a class="nav-link" href="#agendamento">Agendar</a></li>
      </ul>
    </div>
  </div>
</header>

<main class="page-main">
  <div style="max-width: 800px; width: 100%;">
  <h1 class="brand-font text-brand text-center mb-2" style="font-size: clamp(1.8rem, 5vh, 2.8rem);">Meu perfil</h1>
  <p class="text-muted text-center mb-3">Mantenha seus dados atualizados para que a equipe conheça suas preferências antes do atendimento.</p>

  <section class="card rounded-4 overflow-hidden card-profile">
    <div class="cover-brand"></div>
    <div class="card-body px-4 px-md-5 pb-4 pt-0">

      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3">
        <div class="d-flex align-items-end gap-3">
          <div class="avatar rounded-circle d-flex align-items-center justify-content-center">SC</div>
          <div>
            <h2 class="brand-font text-brand mb-0 fs-3">Sua cliente</h2>
            <p class="label-eyebrow mb-0 mt-1">Cliente Sandra Nerys</p>
          </div>
        </div>
        <button class="btn btn-outline-brand rounded-pill px-4 align-self-start mt-4">
          <svg class="icon-svg me-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>Editar perfil
        </button>
      </div>

      <div class="row g-3 mt-4">
        <div class="col-md-6">
          <div class="info-box p-3">
            <div class="label-eyebrow d-flex align-items-center gap-2">
              <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>E-mail
            </div>
            <p class="mb-0 mt-2">cliente@email.com</p>
          </div>
        </div>
        <div class="col-md-6">
          <div class="info-box p-3">
            <div class="label-eyebrow d-flex align-items-center gap-2">
              <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg>Telefone
            </div>
            <p class="mb-0 mt-2">(00) 00000-0000</p>
          </div>
        </div>
      </div>

    </div>
  </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
