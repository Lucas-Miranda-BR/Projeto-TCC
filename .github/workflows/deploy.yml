name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Preparar Estrutura e Proteger Ficheiros
        run: |
          mkdir -p deploy_dist/core
          
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='public' --exclude='deploy_dist' ./ deploy_dist/core/
          
          cp -r public deploy_dist/
          
          rm -f deploy_dist/core/index.php
          rm -f deploy_dist/core/.htaccess
          rm -f deploy_dist/public/index.php
          rm -f deploy_dist/public/.htaccess
          rm -f deploy_dist/index.php
          rm -f deploy_dist/.htaccess

      - name: Enviar para o InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          # Envia a pasta final (já sem os ficheiros index e htaccess)
          local-dir: ./deploy_dist/
          server-dir: htdocs/
          timeout: 600000
